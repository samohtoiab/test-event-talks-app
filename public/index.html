<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechTalks 2026 | One Day Event</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>TechTalks 2026</h1>
            <p>Empowering the next generation of engineers</p>
            <div class="search-container">
                <input type="text" id="categorySearch" placeholder="Search talks by title, speaker, or category..." aria-label="Search talks">
            </div>
        </div>
    </header>

    <main class="container">
        <section id="schedule" aria-label="Event Schedule" aria-live="polite">
            <!-- Talks will be injected here by JavaScript -->
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 TechTalks Event. All rights reserved.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
